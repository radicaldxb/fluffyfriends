# Netlify automatically detects and handles Next.js 16+ without explicit plugin configuration
# The built-in OpenNext adapter provides SSR, ISR, Edge Functions, and image optimization

[build]
  # Must be plain `npm run build` — do not prepend `node scripts/generate-print-guide.mjs` in the Netlify UI (it would overwrite public/print-guide.pdf unless FORCE_GENERATE_PRINT_GUIDE=1).
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Environment variables should be set in Netlify UI (Site settings → Environment variables)
  # Do not commit actual keys/URLs here - they will be detected by secrets scanning
  # Required variables:
  #   NEXT_PUBLIC_SUPABASE_URL = your Supabase project URL
  #   NEXT_PUBLIC_SUPABASE_ANON_KEY = your Supabase anon key
  #   N8N_WEBHOOK_URL = your n8n production webhook URL (e.g. .../webhook/transform-pet)
  # Optional:
  #   N8N_PING_WEBHOOK_URL = test-production-url webhook (for Ping button on /test-n8n)

# Optional: N8N_PING_WEBHOOK_URL = your test-production-url (for "Ping webhook" on /test-n8n).
# If set, Ping uses it; /create always uses N8N_WEBHOOK_URL. Add in Netlify UI.
#
# IMPORTANT: Also add these in Netlify UI for reliability:
# Site settings → Build & deploy → Environment variables
# UI vars override netlify.toml and are more reliable

# Stricter than /* so PDF updates aren’t stuck behind CDN/browser caches (sync ?v= with lib/print-guide.ts).
[[headers]]
  for = "/print-guide.pdf"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate, no-cache"

[[headers]]
  for = "/print-guide"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate, no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
